<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Test</title>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff; 
      overflow: hidden;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="Agamemnon%20Helmet.glb" 
    alt="A test 3D model"
    auto-rotate
    camera-controls
    environment-image="neutral"
    shadow-intensity="1">
  </model-viewer>

  <!-- 
    No script tag in head. 
    Instead, we use a native browser module to bypass CORS filters.
  -->
  <script type="module">
    import 'https://esm.sh';
  </script>

</body>
</html>
