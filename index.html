<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production-Ready OBJ 3D Engine From Scratch</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #111;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #loading {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      font-family: sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="loading">Auto-centering and parsing mesh model...</div>
  <canvas id="glCanvas"></canvas>

  <script>
    const canvas = document.getElementById('glCanvas');
    const gl = canvas.getContext('webgl');

    if (!gl) {
      alert('WebGL not supported by your browser');
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const vsSource = `
      attribute vec4 aVertexPosition;
      attribute vec4 aVertexColor;
      uniform mat4 uModelViewMatrix;
      uniform mat4 uProjectionMatrix;
      varying lowp vec4 vColor;
      void main(void) {
        gl_Position = uProjectionMatrix * uModelViewMatrix * aVertexPosition;
        vColor = aVertexColor;
      }
    `;

    const fsSource = `
      varying lowp vec4 vColor;
      void main(void) {
        gl_FragColor = vColor;
      }
    `;

    function loadShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error('Shader compile error:', gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    const vertexShader = loadShader(gl, gl.VERTEX_SHADER, vsSource);
    const fragmentShader = loadShader(gl, gl.FRAGMENT_SHADER, fsSource);
    const shaderProgram = gl.createProgram();
    gl.attachShader(shaderProgram, vertexShader);
    gl.attachShader(shaderProgram, fragmentShader);
    gl.linkProgram(shaderProgram);

    const programInfo = {
      program: shaderProgram,
      attribLocations: {
        vertexPosition: gl.getAttribLocation(shaderProgram, 'aVertexPosition'),
        vertexColor: gl.getAttribLocation(shaderProgram, 'aVertexColor'),
      },
      uniformLocations: {
        projectionMatrix: gl.getUniformLocation(shaderProgram, 'uProjectionMatrix'),
        modelViewMatrix: gl.getUniformLocation(shaderProgram, 'uModelViewMatrix'),
      },
    };

    let cubeRotationX = 0.4;
    let cubeRotationY = 0.7;
    let buffers = null;

    function parseOBJ(text) {
      const objPositions = [];
      const finalPositions = [];
      const finalColors = [];
      const finalIndices = [];
      
      let indexCounter = 0;

      let minX = Infinity, maxX = -Infinity;
      let minY = Infinity, maxY = -Infinity;
      let minZ = Infinity, maxZ = -Infinity;

      const lines = text.split(/\r?\n/);
      
      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (line.length === 0 || line.startsWith('#')) continue;

        const parts = line.split(/\s+/);
        const type = parts[0];

        if (type === 'v') {
          const x = Number(parts[1]);
          const y = Number(parts[2]);
          const z = Number(parts[3]);
          
          if (!isNaN(x) && !isNaN(y) && !isNaN(z)) {
            objPositions.push([x, y, z]);
            
            if (x < minX) minX = x; if (x > maxX) maxX = x;
            if (y < minY) minY = y; if (y > maxY) maxY = y;
            if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
          }
        } else if (type === 'f') {
          const faceIndices = [];
          
          for (let k = 1; k < parts.length; k++) {
            if (!parts[k]) continue;
            
            let vertexIndex = parseInt(parts[k].split('/')[0], 10);
            
            if (!isNaN(vertexIndex)) {
              if (vertexIndex < 0) {
                vertexIndex = objPositions.length + vertexIndex;
              } else {
                vertexIndex = vertexIndex - 1; 
              }
              faceIndices.push(vertexIndex);
            }
          }
          
          for (let j = 1; j < faceIndices.length - 1; j++) {
            const v0 = objPositions[faceIndices[0]];
            const v1 = objPositions[faceIndices[j]];
            const v2 = objPositions[faceIndices[j+1]];

            if (v0 && v1 && v2) {
              finalPositions.push(...v0, ...v1, ...v2);
              
              finalColors.push(0.40, 0.40, 0.45, 1.0);
              finalColors.push(0.55, 0.55, 0.60, 1.0);
              finalColors.push(0.65, 0.65, 0.70, 1.0);

              finalIndices.push(indexCounter, indexCounter + 1, indexCounter + 2);
              indexCounter += 3;
            }
          }
        }
      }

      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;
      const centerZ = (minZ + maxZ) / 2;

      const sizeX = maxX - minX;
      const sizeY = maxY - minY;
      const sizeZ = maxZ - minZ;
      const maxDimension = Math.max(sizeX, sizeY, sizeZ);
      const scaleFactor = maxDimension > 0 ? (2.5 / maxDimension) : 1;

      for (let i = 0; i < finalPositions.length; i += 3) {
        finalPositions[i]     = (finalPositions[i]     - centerX) * scaleFactor;
        finalPositions[i + 1] = (finalPositions[i + 1] - centerY) * scaleFactor;
        finalPositions[i + 2] = (finalPositions[i + 2] - centerZ) * scaleFactor;
      }

      return {
        positions: new Float32Array(finalPositions),
        colors: new Float32Array(finalColors),
        indices: new Uint16Array(finalIndices)
      };
    }

    fetch('model.obj')
      .then(response => {
        if (!response.ok) throw new Error('Failed to find model.obj in repository folder');
        return response.text();
      })
      .then(text => {
        const meshData = parseOBJ(text);

        if (meshData.positions.length === 0) {
          throw new Error("Empty index grid data mapping compiled.");
        }

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, meshData.positions, gl.STATIC_DRAW);

        const colorBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, meshData.colors, gl.STATIC_DRAW);

        const indexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, meshData.indices, gl.STATIC_DRAW);

        buffers = {
          position: positionBuffer,
          color: colorBuffer,
          index: indexBuffer,
          vertexCount: meshData.indices.length
        };

        document.getElementById('loading').style.display = 'none';
        requestAnimationFrame(drawScene);
      })
      .catch(err => {
        document.getElementById('loading').textContent = 'Error: ' + err.message;
        console.error(err);
      });

    function perspectiveMatrix(fovy, aspect, near, far) {
      const f = 1.0 / Math.tan(fovy / 2);
      const nf = 1.0 / (near - far);
      return [
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) * nf, -1,
        0, 0, (2 * far * near) * nf, 0
      ];
    }

    function drawScene() {
      if (!buffers) return;

      gl.clearColor(0.07, 0.07, 0.09, 1.0);
      gl.clearDepth(1.0);
      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LEQUAL);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

      const projectionMatrix = perspectiveMatrix(45 * Math.PI / 180, canvas.width / canvas.height, 0.1, 100.0);

      const cx = Math.cos(cubeRotationX), sx = Math.sin(cubeRotationX);
      const cy = Math.cos(cubeRotationY), sy = Math.sin(cubeRotationY);

      const modelViewMatrix = [
        cy, sx * sy, -cx * sy, 0,
        0, cx, sx, 0,
        sy, -sx * cy, cx * cy, 0,
        0, 0, -6.0, 1
      ];

      gl.bindBuffer(gl.ARRAY_BUFFER, buffers.position);
      gl.vertexAttribPointer(programInfo.attribLocations.vertexPosition, 3, gl.FLOAT, false, 0, 0);
      gl.enableVertexAttribArray(programInfo.attribLocations.vertexPosition);

      gl.bindBuffer(gl.ARRAY_BUFFER, buffers.color);
      gl.vertexAttribPointer(programInfo.attribLocations.vertexColor, 4, gl.FLOAT, false, 0, 0);
      gl.enableVertexAttribArray(programInfo.attribLocations.vertexColor);

      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, buffers.index);

      gl.useProgram(programInfo.program);

      gl.uniformMatrix4fv(programInfo.uniformLocations.projectionMatrix, false, new Float32Array(projectionMatrix));
      gl.uniformMatrix4fv(programInfo.uniformLocations.modelViewMatrix, false, new Float32Array(modelViewMatrix));

      gl.drawElements(gl.TRIANGLES, buffers.vertexCount, gl.UNSIGNED_SHORT, 0);

      cubeRotationX += 0.002;
      cubeRotationY += 0.003;

      requestAnimationFrame(drawScene);
    }

    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };

    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - previousMousePosition.x;
      const deltaY = e.clientY - previousMousePosition.y;

      cubeRotationY += deltaX * 0.01;
      cubeRotationX += deltaY * 0.01;

      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', () => isDragging = false);
  </script>

</body>
</html>
