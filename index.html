<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll-Driven 3D Perspective Shift</title>
  
  <!-- Import Google Model Viewer -->
  <script type="module" src="https://googleapis.com"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0b0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Long scrolling track to give the user room to scroll */
    .scroll-track {
      height: 300vh; 
      position: relative;
    }

    /* Keeps the 3D canvas locked in the center of the screen while scrolling */
    .viewer-sticky-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none; /* Let scroll events pass through to the page */
    }

    model-viewer {
      width: 80vw;
      height: 80vh;
      max-width: 800px;
      max-height: 800px;
      pointer-events: auto; /* Re-enable pointer events just for the model if needed */
      --min-camera-orbit: auto auto auto;
      --max-camera-orbit: auto auto auto;
    }

    /* Educational guide overlay to see the mechanics working */
    .scroll-hints {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      padding: 15px 30px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      pointer-events: none;
    }

    .scroll-hints h2 {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #00ffcc;
      margin-bottom: 4px;
    }

    .scroll-hints p {
      font-size: 0.85rem;
      color: #8a8a93;
    }
  </style>
</head>
<body>

  <!-- The scroll container -->
  <div class="scroll-track">
    
    <!-- Fixed viewport container -->
    <div class="viewer-sticky-wrapper">
      
      <!-- 
        Using a standard Box model for clear geometry visualization.
        'interaction-prompt="none"' disables default hand animations.
      -->
      <model-viewer 
        id="perspective-model"
        src="Agamemnon Helmet.stl" 
        alt="A 3D object transitioning perspectives"
        camera-controls
        interaction-prompt="none"
        shadow-intensity="1.5"
        shadow-softness="0.5">
      </model-viewer>

    </div>

  </div>

  <!-- HUD overlay showing active state -->
  <div class="scroll-hints">
    <h2 id="hud-title">Far Away View</h2>
    <p>Scroll down to fly directly overhead</p>
  </div>

  <script>
    const modelViewer = document.getElementById('perspective-model');
    const hudTitle = document.getElementById('hud-title');

    // Camera settings for our two key states
    const config = {
      // STARTING STATE (Far away, view from side/front and slightly top)
      start: {
        degX: 45,    // Horizontal angle (shows the side)
        degY: 65,    // Vertical angle (65 deg down from top = looking mostly at side)
        distance: 4  // Far away radius (in meters/relative units)
      },
      // ENDING STATE (Close up, perfectly overhead bird's-eye view)
      end: {
        degX: 0,     // Horizontal angle perfectly flattened 
        degY: 0,     // Vertical angle 0 = pointing directly downwards from the ceiling
        distance: 1.5 // Zoomed in closely
      }
    };

    function updatePerspective() {
      // 1. Calculate how far down the page the user has scrolled (0.0 to 1.0)
      const scrollTop = window.scrollY;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      
      // Prevent division by zero if page hasn't rendered sizing yet
      if (maxScroll <= 0) return;
      
      const scrollFraction = Math.min(Math.max(scrollTop / maxScroll, 0), 1);

      // 2. Interpolate values linearly based on scroll fraction
      const currentDegX = config.start.degX + (config.end.degX - config.start.degX) * scrollFraction;
      const currentDegY = config.start.degY + (config.end.degY - config.start.degY) * scrollFraction;
      const currentDistance = config.start.distance + (config.end.distance - config.start.distance) * scrollFraction;

      // 3. Apply calculated parameters to the model-viewer camera-orbit attribute
      // Syntax: camera-orbit="[horizontal angle]deg [vertical angle]deg [distance]"
      modelViewer.cameraOrbit = `${currentDegX}deg ${currentDegY}deg ${currentDistance}m`;

      // 4. Update HUD text to reflect layout state changes
      if (scrollFraction < 0.2) {
        hudTitle.textContent = "Perspective: Far (Side/Top View)";
        hudTitle.style.color = "#00ffcc";
      } else if (scrollFraction > 0.8) {
        hudTitle.textContent = "Perspective: Overhead (Top Only)";
        hudTitle.style.color = "#ff007f";
      } else {
        hudTitle.textContent = "Perspective: Shifting Camera...";
        hudTitle.style.color = "#ffcc00";
      }
    }

    // Bind logic to window scrolling and initialization checks
    window.addEventListener('scroll', updatePerspective);
    window.addEventListener('resize', updatePerspective);
    
    // Fire once on load to ensure proper camera placement on refresh
    modelViewer.addEventListener('load', updatePerspective);
  </script>

</body>
</html>
