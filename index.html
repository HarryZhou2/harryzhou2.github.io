<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Test</title>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff; 
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- Ensure your filename matches exactly (case-sensitive on GitHub) -->
  <model-viewer 
    src="Agamemnon%20Helmet.glb" 
    alt="A test 3D model"
    auto-rotate
    camera-controls
    environment-image="neutral"
    shadow-intensity="1">
  </model-viewer>

  <!-- 
    This loads the 3D player natively using modern browser modules. 
    It is fully allowed on GitHub Pages and bypasses CORS.
  -->
  <script type="module">
    import 'https://jsdelivr.net';
  </script>

</body>
</html>
